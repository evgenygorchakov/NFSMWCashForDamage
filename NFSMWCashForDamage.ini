; NFSMWCashForDamage: career cash for Cost to State.
; A comment starts with ; or # and can be anywhere on a line.

; 1 = plugin on, 0 = off.
Enabled=1

; Dollars paid per $1 of damage. 0 to 1000, decimals with a dot: 0.5.
; Fractions are not lost: they add up until they reach a whole dollar.
Multiplier=1.0

; How often the plugin checks the game, in milliseconds. 10 to 5000.
PollIntervalMs=100

; What counts as damage:
;   CostToState  - the pursuit total, the same Cost to State number shown on screen.
;                  It includes police costs too: helicopters, roadblocks, backup.
;   PlayerDamage - only what the player hit or rammed
;                  (poles, bus stops, police cars).
;   Bounty       - reserved, works as CostToState for now.
Source=CostToState

; 1 = write NFSMWCashForDamage.log next to the plugin, 0 = only critical errors.
Log=1
