; NFSMWCashForDamage: деньги за «Ущерб государству» (Cost to State) в карьере.
; Комментарий начинается с ; или # и может стоять в любом месте строки.

; 1 — плагин работает, 0 — выключен.
Enabled=1

; Сколько долларов давать за $1 ущерба. От 0 до 1000, дробная часть через точку: 0.5.
; Дробные суммы не теряются, а копятся до целого доллара.
Multiplier=1.0

; Как часто плагин проверяет игру, в миллисекундах. От 10 до 5000.
PollIntervalMs=100

; Что считать ущербом:
;   CostToState  — итог погони, то самое число «Ущерб государству» на экране.
;                  В него входят и расходы полиции: вертолёты, заслоны, подкрепление.
;   PlayerDamage — только то, что разбил или протаранил сам игрок
;                  (столбы, остановки, машины полиции).
;   Bounty       — зарезервировано, пока работает как CostToState.
Source=CostToState

; 1 — писать NFSMWCashForDamage.log рядом с плагином, 0 — только критические ошибки.
Log=1
